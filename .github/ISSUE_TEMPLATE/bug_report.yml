name: Bug 反馈
description: 反馈可复现的软件问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要说明遇到的问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请列出从打开软件到出现问题的操作步骤。
      placeholder: |
        1. 打开软件
        2. 输入 ...
        3. 点击 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 软件版本或提交号
      placeholder: 例如 1.0.0
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: 例如 Windows 11 x64 / .NET Desktop Runtime 10.x
